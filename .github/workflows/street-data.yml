name: street-data
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['trip.json','tools/build-stations.mjs','tools/street-matrix.mjs','tools/build-paths.mjs','.github/workflows/street-data.yml']
permissions:
  contents: write
concurrency: street-data
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Street walking matrix (OSM)
        run: node tools/street-matrix.mjs trip.json street-matrix.json
      - name: Street paths (OSM)
        run: node tools/build-paths.mjs trip.json paths.json | tee build-paths-report.json
      - name: Metro stations (OSM)
        run: node tools/build-stations.mjs stations.json || echo 'stations build failed'
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add street-matrix.json paths.json build-paths-report.json; [ -f stations.json ] && git add stations.json
          git diff --cached --quiet || git commit -m "street data: OSM walking matrix and paths"
          git fetch origin main && git rebase -X theirs origin/main && git push origin HEAD:main
